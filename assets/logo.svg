<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="You Read, I Read">
  <!--
    You Read, I Read — light theme logo.
    Two offset paper cards: the front one is "you," the back one is "I (the agent)."
    A shared horizontal accent line runs across both, suggesting the same source
    being read together. Designed for a light background.
  -->
  <title>You Read, I Read</title>

  <!-- ===== Mark: 0–200 ===== -->
  <g transform="translate(20, 20)">
    <!-- Back card (the agent) -->
    <rect x="40" y="36" width="116" height="124" rx="8"
          fill="#FFFFFF" stroke="#1A2332" stroke-width="3"/>
    <!-- text lines -->
    <line x1="58" y1="62"  x2="138" y2="62"  stroke="#D5D8DD" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="78"  x2="124" y2="78"  stroke="#D5D8DD" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="94"  x2="138" y2="94"  stroke="#D5D8DD" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="110" x2="116" y2="110" stroke="#D5D8DD" stroke-width="3" stroke-linecap="round"/>
    <!-- I-accent: slate blue square (lower-right) -->
    <rect x="132" y="138" width="14" height="14" rx="2" fill="#4A6B9D"/>

    <!-- Front card (the user) -->
    <rect x="0" y="0" width="116" height="124" rx="8"
          fill="#FFFFFF" stroke="#1A2332" stroke-width="3"/>
    <!-- text lines -->
    <line x1="18" y1="26"  x2="98"  y2="26"  stroke="#D5D8DD" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="42"  x2="84"  y2="42"  stroke="#D5D8DD" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="58"  x2="98"  y2="58"  stroke="#D5D8DD" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="74"  x2="76"  y2="74"  stroke="#D5D8DD" stroke-width="3" stroke-linecap="round"/>
    <!-- You-accent: terracotta circle (lower-right) -->
    <circle cx="100" cy="103" r="7" fill="#C97863"/>

    <!-- Connecting accent: a thin line from front You-dot toward back I-square,
         suggesting the two readers share one source. -->
    <line x1="105" y1="108" x2="135" y2="138"
          stroke="#1A2332" stroke-width="1.5" stroke-linecap="round"
          stroke-dasharray="2 4" opacity="0.55"/>
  </g>

  <!-- ===== Wordmark: 220–720 ===== -->
  <g transform="translate(220, 0)">
    <text x="0" y="108" font-family="ui-serif, 'Iowan Old Style', 'Apple Garamond', Georgia, 'Times New Roman', serif"
          font-size="56" font-weight="600" fill="#1A2332"
          letter-spacing="-0.5">You Read,<tspan dx="6">I</tspan> Read</text>
    <text x="2" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="16" font-weight="400" fill="#5A6373"
          letter-spacing="0.4">a persistent reading agent for Claude Code</text>
  </g>
</svg>
